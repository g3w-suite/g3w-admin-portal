name: PORTAL CI tests

on: [push, pull_request]

jobs:

  frontend_tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-test.txt
    - run: python -m pip install -r requirements-test.txt
    - run: python -m playwright install --with-deps ${{ matrix.browser }}
    - run: python -m behave --tags=browser -D browser=${{ matrix.browser }} --junit --junit-directory portal/tests/results
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-bdd-${{ matrix.browser }}
        path: portal/tests/results

  ci_tests:

    runs-on: ubuntu-24.04

    steps:

    - uses: actions/checkout@v4
      with:
        repository: 'g3w-suite/g3w-admin'

    - uses: actions/checkout@v4
      with:
        path: 'portal'

    - name: Move PORTAL inside G3W-ADMIN
      run: |
        mv portal/portal g3w-admin/
        mv portal/requirements.txt portal/requirements-test.txt g3w-admin/portal/
        echo "$(ls -lh g3w-admin/portal)"

    - name: Starting Docker compose
      run: docker compose -f docker-compose.ltr.yml up -d

    - name: Copying code into the container
      run: |
        docker cp ./ "$(docker compose -f docker-compose.ltr.yml ps -q g3w-suite)":/code

    - name: Installing G3W-ADMIN Python requirements
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "cd /code/ && pip3 install -r requirements_docker.txt --break-system-packages && pip3 install -r requirements_huey.txt --break-system-packages"

    - name: Activate PORTAL module
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "printf '\nG3WADMIN_LOCAL_MORE_APPS = [\"portal\"]\n' >> /code/settings_docker.py"

    - name: Install PORTAL python requirements
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "cd /code/ && pip3 install -r g3w-admin/portal/requirements.txt -r g3w-admin/portal/requirements-test.txt --break-system-packages"

    - name: Building g3w-suite
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "/code/ci_scripts/build_suite.sh"

    - name: Setting up g3w-suite
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "/code/ci_scripts/setup_suite.sh"

    - name:  Running PORTAL tests
      run: |
        docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && DJANGO_SETTINGS_MODULE=base.settings python3 -m behave portal/tests/features --tags=backend --format progress --junit --junit-directory /tmp/portal-bdd-results"

    - name: Collect backend BDD reports
      if: always()
      run: |
        docker compose -f docker-compose.ltr.yml cp g3w-suite:/tmp/portal-bdd-results ./backend-bdd-results

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-bdd-report
        path: backend-bdd-results


    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 15
      with:
        limit-access-to-actor: true
